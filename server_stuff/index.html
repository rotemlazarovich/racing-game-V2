<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Split Screen Debug</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        #setup { position: fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; }
        #qrcode { background: white; padding: 10px; }
        .viewport { display: flex; width: 100vw; height: 100vh; }
        .lane { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white; transition: 0.1s; border: 2px solid black; }
        .down { background: #aa0000; }
        .up { background: #00aa00; }
    </style>
</head>
<body>

    <div id="setup">
        <div id="qrcode"></div>
        <h1>ROOM: <span id="roomid"></span></h1>
    </div>

    <div class="viewport">
        <div id="p1" class="lane down">P1 DOWN</div>
        <div id="p2" class="lane down">P2 DOWN</div>
    </div>

    <script>
        const socket = io();
        const roomId = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('roomid').innerText = roomId;

        new QRCode(document.getElementById("qrcode"), {
            text: window.location.origin + "/?room=" + roomId,
            width: 200, height: 200
        });

        socket.emit('join_room', { room_id: roomId, type: 'web' });

        socket.on("game_action", (data) => {
            console.log("RECEIVED:", data); // THIS SHOULD PRINT NOW
            
            // Hide setup once data flows
            document.getElementById('setup').style.display = 'none';

            const p1Div = document.getElementById('p1');
            const p2Div = document.getElementById('p2');

            // Update P1
            if(data.p1 === "up") {
                p1Div.className = "lane up";
                p1Div.innerText = "P1: UP";
            } else {
                p1Div.className = "lane down";
                p1Div.innerText = "P1: DOWN";
            }

            // Update P2
            if(data.p2 === "up") {
                p2Div.className = "lane up";
                p2Div.innerText = "P2: UP";
            } else {
                p2Div.className = "lane down";
                p2Div.innerText = "P2: DOWN";
                }
            });
    </script>
</body>
</html>
