<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Racing Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>window.ROOM_ID = "{{ room_id }}";</script>
</head>
<body>
    <div id="connection-overlay">
        <h1>Connect Your Controller</h1>
        <div class="qr-frame">
            {% if qr_data_url %}<img src="{{ qr_data_url }}">{% endif %}
        </div>
        <p>Room: {{ room_id }}</p>
    </div>

    <div id="ready-overlay" style="display:none;">
        <h1 id="ready-status">RAISE HANDS TO START</h1>
        <div id="countdown-bar"><div id="countdown-progress"></div></div>
    </div>

    <canvas id="gameCanvas" style="width: 100vw; height: 100vh; background: #222;"></canvas>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script src="{{ url_for('static', filename='racing.js') }}"></script>
</body>
</html>
