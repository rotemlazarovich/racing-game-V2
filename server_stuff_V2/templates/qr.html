<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR – Room {{ room_id }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .qr-page { padding: 2rem; text-align: center; max-width: 420px; margin: 0 auto; }
    .qr-page h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .qr-page p { color: #aaa; font-size: 0.9rem; margin: 0.5rem 0; }
    .qr-page img { display: block; margin: 1.5rem auto; border: 1px solid #333; border-radius: 8px; }
    .qr-page .url { word-break: break-all; font-size: 0.85rem; color: #8af; margin: 1rem 0; }
    .qr-page a { color: #6cf; }
    .qr-page form { margin-top: 1.5rem; }
    .qr-page input { padding: 0.5rem; width: 12rem; margin-right: 0.5rem; background: #222; border: 1px solid #444; color: #eee; border-radius: 4px; }
    .qr-page button { padding: 0.5rem 1rem; background: #2a2; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .qr-page .no-qr { background: #222; padding: 1rem; border-radius: 8px; color: #caa; }
  </style>
</head>
<body>
  <div class="qr-page">
    <h1>Scan with your phone</h1>
    <p>Open the Rotem app and scan this QR code to connect the camera to room <strong>{{ room_id }}</strong>.</p>
    {% if has_qrcode and qr_data_url %}
    <img src="{{ qr_data_url }}" alt="QR code" width="320" height="320" />
    {% else %}
    <p class="no-qr">QR image not available. Install: <code>pip install qrcode[pil]</code></p>
    {% endif %}
    <p class="url">{{ url }}</p>
    <p><a href="{{ url_for('room', room_id=room_id) }}">Open display for this room →</a></p>
    <form action="{{ url_for('qr_page') }}" method="get">
      <label for="room">Different room:</label><br>
      <input type="text" id="room" name="room" value="{{ room_id }}" placeholder="room name" />
      <button type="submit">Show QR</button>
    </form>
  </div>
</body>
</html>
