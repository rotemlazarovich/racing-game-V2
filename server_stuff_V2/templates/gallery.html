<style>
    .gallery { display: flex; gap: 20px; padding: 50px; justify-content: center; }
    .game-card { 
        width: 250px; height: 350px; background: #333; border-radius: 15px;
        transition: transform 0.3s; cursor: pointer; overflow: hidden;
        border: 3px solid transparent;
    }
    .game-card:hover { transform: scale(1.05); border-color: #00ff64; }
    .game-card img { width: 100%; height: 200px; object-fit: cover; }
    .game-card h2 { text-align: center; color: white; margin-top: 20px; }
</style>

<div class="gallery">
    {% for game in games %}
    <div class="game-card" onclick="location.href='/setup/{{ game.id }}'">
        <img src="/static/images/{{ game.image }}" alt="{{ game.name }}">
        <h2>{{ game.name }}</h2>
    </div>
    {% endfor %}
</div>
